<!doctype html><html><head><meta charset="utf-8"></head>
<body style="margin:0;width:1080px;height:1920px;background:#111;font-family:Arial,sans-serif;color:#fff">
<h1 id="t" data-check style="position:absolute;left:100px;top:400px;font-size:70px;margin:0">Moving headline</h1>
<script>
  const el = document.getElementById('t')
  window.DURATION = 3
  // 2–3 s: the headline drops into TikTok's caption area → must be reported
  window.renderAt = (t) => { el.style.top = (t < 2 ? 400 : 1600) + 'px' }
  window.ready = true
</script>
</body></html>
